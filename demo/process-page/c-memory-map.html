<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GNOUS · 进程页 C Memory Map</title>
<style>
  :root{
    --bg:#000000;--surface:#0A0A0B;--surface-2:#111113;
    --line:rgba(255,255,255,.09);--line-strong:rgba(255,255,255,.18);--line-faint:rgba(255,255,255,.05);
    --text:#F5F5F7;--muted:#86868B;--dim:#5A5A60;--accent:#E31937;--ok:#37D67A;--warn:#F5A623;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scrollbar-width:thin;scrollbar-color:#242424 transparent}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:"Helvetica Neue",Inter,"Segoe UI",system-ui,"Noto Sans SC",sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum";overflow:hidden}
  .app{display:grid;grid-template-columns:68px 1fr;height:100vh}

  .rail{border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:22px 0;gap:6px}
  .brand{width:30px;height:30px;border:1px solid var(--line-strong);display:grid;place-items:center;margin-bottom:26px;font-size:11px;letter-spacing:.08em;font-weight:600}
  .rail button{width:40px;height:40px;background:none;border:0;color:var(--dim);display:grid;place-items:center;cursor:pointer;position:relative;transition:color .18s}
  .rail button:hover{color:var(--text)}
  .rail button.active{color:var(--text)}
  .rail button.active::before{content:"";position:absolute;left:-14px;top:12px;bottom:12px;width:2px;background:var(--accent)}
  .rail svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.3}
  .rail .spacer{flex:1}

  main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
  .topbar{height:56px;flex:0 0 56px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:34px;padding:0 40px}
  .wordmark{font-size:13px;letter-spacing:.34em;font-weight:500}
  nav{display:flex;gap:30px;height:100%}
  nav a{display:flex;align-items:center;color:var(--muted);text-decoration:none;font-size:12px;letter-spacing:.13em;text-transform:uppercase;border-bottom:1px solid transparent;transition:color .18s,border-color .18s}
  nav a:hover{color:var(--text)}
  nav a.on{color:var(--text);border-bottom-color:var(--accent)}
  .topbar .right{margin-left:auto;display:flex;align-items:center;gap:22px;color:var(--muted);font-size:12px;letter-spacing:.06em}
  .dot{width:5px;height:5px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:7px;vertical-align:1px}
  .clock{font-variant-numeric:tabular-nums;color:var(--text)}

  .scroll{overflow-y:auto;flex:1;padding:44px 40px 56px}
  .scroll::-webkit-scrollbar{width:6px}
  .scroll::-webkit-scrollbar-thumb{background:#222}

  .eyebrow{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--dim);margin-bottom:14px}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:30px}
  h1{font-size:38px;font-weight:200;letter-spacing:-.02em;line-height:1.05}
  .sub{color:var(--muted);font-size:12.5px;margin-top:10px;letter-spacing:.02em}
  .total{text-align:right}
  .total .v{font-size:34px;font-weight:200;letter-spacing:-.02em}
  .total .v small{font-size:13px;font-weight:300;color:var(--muted);margin-left:5px}
  .total .k{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-top:6px}

  .memory-bar{height:2px;background:var(--line-strong);position:relative;margin-bottom:26px}
  .memory-bar i{position:absolute;left:0;top:-1px;height:4px;background:var(--text)}
  .memory-bar span{position:absolute;right:0;top:-16px;font-size:10px;color:var(--dim);letter-spacing:.08em}

  .layout{display:grid;grid-template-columns:1fr 300px;gap:1px;background:var(--line);border:1px solid var(--line)}
  .pane{background:var(--bg);padding:22px}

  svg.map{width:100%;height:430px;display:block;cursor:pointer}
  svg.map .blk{stroke:#000;stroke-width:1.5;transition:fill .15s}
  svg.map .blk:hover{fill:rgba(255,255,255,.16)}
  svg.map .blk.sel{fill:rgba(227,25,55,.22);stroke:var(--accent)}
  svg.map text{fill:var(--text);font-size:11px;letter-spacing:.02em;pointer-events:none}
  svg.map text.meta{fill:var(--dim);font-size:9.5px;letter-spacing:.08em}

  .detail .k{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin-bottom:14px}
  .detail h2{font-size:19px;font-weight:300;letter-spacing:-.01em}
  .detail .pid{font-size:10.5px;color:var(--dim);letter-spacing:.08em;margin-top:5px}
  .detail .big{font-size:38px;font-weight:200;letter-spacing:-.03em;margin-top:22px}
  .detail .big small{font-size:12px;font-weight:300;color:var(--muted);margin-left:6px}
  .detail .rows{margin-top:20px;border-top:1px solid var(--line)}
  .detail .rows div{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line-faint);font-size:11.5px;color:var(--muted)}
  .detail .rows b{color:var(--text);font-weight:400;font-variant-numeric:tabular-nums}
  .detail .act{margin-top:20px;width:100%}
  .btn{background:none;border:1px solid var(--line-strong);color:var(--text);padding:10px 16px;font:inherit;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:.18s;width:100%}
  .btn:hover{background:#fff;color:#000;border-color:#fff}

  .list{margin-top:18px}
  .list .hdr{display:flex;justify-content:space-between;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);padding-bottom:8px;border-bottom:1px solid var(--line)}
  .list .item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-faint);font-size:11.5px;cursor:pointer}
  .list .item:hover{color:#fff}
  .list .item b{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
  .list .item.sel{color:var(--accent)}
  .list .item.sel b{color:var(--accent)}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">G</div>
    <button class="active" title="概览"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></button>
    <button title="扩展"><svg viewBox="0 0 24 24"><path d="M10 3h4v4h4v4h4v4h-4v4h-4v-4H10v4H6v-4H2v-4h4V7h4z"/></svg></button>
    <button title="外观"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg></button>
    <button title="设备"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="13"/><path d="M8 21h8M12 17v4"/></svg></button>
    <button title="电源"><svg viewBox="0 0 24 24"><path d="M12 2v10"/><path d="M6 6a8 8 0 1 0 12 0"/></svg></button>
    <div class="spacer"></div>
    <button title="设置"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.6-2-3.4-2.4 1a7 7 0 0 0-1.7-1L14.5 3h-4l-.3 2.6a7 7 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7 7 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 1.7 1l.3 2.6h4l.3-2.6a7 7 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6c.1-.3.1-.7.1-1z"/></svg></button>
  </aside>

  <main>
    <header class="topbar">
      <div class="wordmark">GNOUS</div>
      <nav>
        <a href="#">Overview</a>
        <a href="#" class="on">Processes</a>
      </nav>
      <div class="right">
        <span><span class="dot"></span>System nominal</span>
        <span>GNOME 48 · Wayland</span>
        <span class="clock">21:04</span>
      </div>
    </header>

    <div class="scroll">
      <div class="page-head">
        <div>
          <div class="eyebrow">Processes · Memory map · asus</div>
          <h1>内存地图</h1>
          <div class="sub">面积 = 常驻内存 · 点击方块查看进程</div>
        </div>
        <div class="total">
          <div class="v">11.2<small>/ 15 GB</small></div>
          <div class="k">已用内存</div>
        </div>
      </div>

      <div class="memory-bar">
        <span>75%</span>
        <i style="width:75%"></i>
      </div>

      <div class="layout">
        <div class="pane">
          <svg class="map" id="map" viewBox="0 0 720 430" preserveAspectRatio="none"></svg>
        </div>

        <div class="pane detail">
          <div class="k">选中进程</div>
          <h2 id="d-name">firefox</h2>
          <div class="pid" id="d-pid">PID 9210 · me</div>
          <div class="big"><span id="d-mem">1.8</span><small>GB 常驻</small></div>
          <div class="rows">
            <div><span>占已用内存</span><b id="d-share">16.1%</b></div>
            <div><span>CPU</span><b id="d-cpu">6.1%</b></div>
            <div><span>线程</span><b id="d-threads">84</b></div>
            <div><span>状态</span><b id="d-state">SLEEP</b></div>
            <div><span>启动时间</span><b>3 天前</b></div>
          </div>
          <button class="btn act">结束进程</button>

          <div class="list">
            <div class="hdr"><span>按内存排序</span><span>常驻</span></div>
            <div id="d-list"></div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
const PROCS = [
  {n:"firefox",         pid:9210, user:"me",   mb:1843, cpu:6.1, threads:84, state:"SLEEP"},
  {n:"code",            pid:12034,user:"me",   mb:964,  cpu:1.8, threads:38, state:"RUNNING"},
  {n:"gnome-shell",     pid:1842, user:"gdm",  mb:412,  cpu:8.4, threads:62, state:"RUNNING"},
  {n:"Xwayland",        pid:1791, user:"me",   mb:221,  cpu:0.9, threads:8,  state:"SLEEP"},
  {n:"gnome-software",  pid:7721, user:"me",   mb:196,  cpu:0.1, threads:9,  state:"SLEEP"},
  {n:"gnome-terminal",  pid:15322,user:"me",   mb:148,  cpu:0.3, threads:6,  state:"RUNNING"},
  {n:"btrfs-scrub",     pid:44102,user:"root", mb:86,   cpu:2.2, threads:3,  state:"IO WAIT"},
  {n:"tracker-miner-fs",pid:8811, user:"me",   mb:74,   cpu:0.1, threads:4,  state:"IDLE"},
  {n:"pipewire",        pid:2103, user:"me",   mb:62,   cpu:0.4, threads:12, state:"SLEEP"},
  {n:"NetworkManager",  pid:733,  user:"root", mb:52,   cpu:0.0, threads:4,  state:"SLEEP"},
  {n:"systemd-journald",pid:412,  user:"root", mb:38,   cpu:0.1, threads:5,  state:"SLEEP"},
  {n:"其余 301 个进程",  pid:0,    user:"",     mb:2920, cpu:null,threads:null,state:""},
].sort((a,b)=>b.mb-a.mb);

const USED = PROCS.reduce((s,p)=>s+p.mb,0);   // MB
const TOTAL = 15360;

function layout(items, x, y, w, h){
  if(!items.length) return [];
  if(items.length===1) return [{...items[0], x, y, w, h}];
  const total = items.reduce((s,i)=>s+i.mb,0);
  let acc=0, split=items.length;
  for(let i=0;i<items.length;i++){ acc+=items[i].mb; if(acc/total>=0.5){ split=i+1; break; } }
  const a=items.slice(0,split), b=items.slice(split);
  const frac=a.reduce((s,i)=>s+i.mb,0)/total;
  if(w>=h){
    const aw=w*frac;
    return [...layout(a,x,y,aw,h), ...layout(b,x+aw,y,w-aw,h)];
  }
  const ah=h*frac;
  return [...layout(a,x,y,w,ah), ...layout(b,x,y+ah,w,h-ah)];
}

const map = document.querySelector("#map");
let selected = "firefox";

function paint(){
  const blocks = layout(PROCS, 0, 0, 720, 430);
  map.innerHTML = blocks.map(b=>{
    const isSel = b.n === selected;
    const shade = b.pid === 0 ? .03 : Math.min(.05 + (b.mb/USED)*.3, .2);
    const label = b.n.length > 16 ? b.n.slice(0,15) + "…" : b.n;
    const showText = b.w > 86 && b.h > 34;
    return `<g data-name="${b.n}">
      <rect class="blk${isSel?" sel":""}" x="${b.x+1}" y="${b.y+1}" width="${Math.max(b.w-2,0)}" height="${Math.max(b.h-2,0)}"
            fill="${isSel?"rgba(227,25,55,.22)":`rgba(255,255,255,${shade})`}"/>
      ${showText?`<text x="${b.x+10}" y="${b.y+20}">${label}</text>
      <text class="meta" x="${b.x+10}" y="${b.y+34}">${b.mb>=1024?(b.mb/1024).toFixed(1)+" GB":b.mb+" MB"}</text>`:""}
    </g>`;
  }).join("");

  map.querySelectorAll("g[data-name]").forEach(g=>{
    g.addEventListener("click", ()=>{ selected = g.dataset.name; paint(); detail(); });
  });

  document.querySelector("#d-list").innerHTML = PROCS.slice(0,6).map(p=>`
    <div class="item${p.n===selected?" sel":""}" data-name="${p.n}">
      <span>${p.n}</span><b>${p.mb>=1024?(p.mb/1024).toFixed(1)+" GB":p.mb+" MB"}</b>
    </div>`).join("");
  document.querySelectorAll("#d-list .item").forEach(el=>{
    el.addEventListener("click", ()=>{ selected = el.dataset.name; paint(); detail(); });
  });
}

function detail(){
  const p = PROCS.find(x=>x.n===selected) || PROCS[0];
  document.querySelector("#d-name").textContent = p.n;
  document.querySelector("#d-pid").textContent = p.pid ? `PID ${p.pid} · ${p.user}` : "汇总行";
  document.querySelector("#d-mem").textContent = (p.mb/1024).toFixed(1);
  document.querySelector("#d-share").textContent = (p.mb/USED*100).toFixed(1) + "%";
  document.querySelector("#d-cpu").textContent = p.cpu===null ? "—" : p.cpu.toFixed(1) + "%";
  document.querySelector("#d-threads").textContent = p.threads ?? "—";
  document.querySelector("#d-state").textContent = p.state || "—";
}

paint(); detail();
</script>
</body>
</html>
